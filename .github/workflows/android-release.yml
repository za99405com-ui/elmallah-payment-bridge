name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_SIGNING_PASSWORD" ]; then
            echo "Release signing secrets are not configured."
            exit 1
          fi

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/elmallah-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/elmallah-release.jks" \
            -storepass "${{ secrets.ANDROID_SIGNING_PASSWORD }}" \
            -alias upload >/dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run release lint
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/elmallah-release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KEY_ALIAS: upload
        run: ./gradlew lintRelease --no-daemon

      - name: Assemble signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/elmallah-release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KEY_ALIAS: upload
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename release APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/ElMallah-Payment-Bridge-release.apk

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: elmallah-payment-bridge-signed-release
          path: release-output/ElMallah-Payment-Bridge-release.apk
          if-no-files-found: error
          retention-days: 30
